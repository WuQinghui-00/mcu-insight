[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-insight"
version = "0.1.0"
description = "Static and runtime resource analysis for embedded firmware (ESP-IDF / FreeRTOS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
# Only needed to read frames straight off a board; everything else runs on the
# standard library alone.
serial = ["pyserial>=3.5"]

[project.urls]
Repository = "https://github.com/WuQinghui-00/mcu-insight"
Guide = "https://wuqinghui-00.github.io/mcu-insight/"

[project.scripts]
mcu-insight = "mcu_insight.cli:main"

[tool.setuptools.packages.find]
include = ["mcu_insight*"]
